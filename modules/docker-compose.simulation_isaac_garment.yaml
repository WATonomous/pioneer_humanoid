# garment_fold_task-only variant of simulation_isaac: same image plus the
# Isaac Lab 2.3.0 downgrade + open3d it needs (see isaac_lab_garment.Dockerfile
# and garment_fold_task/README.md for why this is a separate service).
#
# Usage: ACTIVE_MODULES="simulation_isaac_garment" ./watod up -d && \
#        ./watod -t simulation_isaac_garment_dev
x-simulation_isaac_garment_volumes: &simulation_isaac_garment_volumes
  - /tmp/.X11-unix:/tmp/.X11-unix:rw
  - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:rw
  - ${MONO_DIR}:/workspace/humanoid:rw
  - ${MONO_DIR}/docker/simulation/isaac_lab/entrypoint.sh:/entrypoint.sh:ro
  # Quest VR teleop's WebXR/WSS cert (same mount as simulation_isaac).
  - ${MONO_DIR}/src/teleop/quest_teleop/certs:/certs:ro
  - /dev:/dev
  - /run/udev:/run/udev:ro
  - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface:rw
  - ${ISAAC_SIM_CACHE_DIR}/cache/kit:/isaac-sim/kit/cache:rw
  - ${ISAAC_SIM_CACHE_DIR}/cache/ov:/root/.cache/ov:rw
  - ${ISAAC_SIM_CACHE_DIR}/cache/pip:/root/.cache/pip:rw
  - ${ISAAC_SIM_CACHE_DIR}/cache/glcache:/root/.cache/nvidia/GLCache:rw
  - ${ISAAC_SIM_CACHE_DIR}/cache/computecache:/root/.nv/ComputeCache:rw
  - ${ISAAC_SIM_CACHE_DIR}/logs:/root/.nvidia-omniverse/logs:rw
  - ${ISAAC_SIM_CACHE_DIR}/data:/root/.local/share/ov/data:rw

x-simulation_isaac_garment_env: &simulation_isaac_garment_env
  - ACCEPT_EULA=Y
  - PRIVACY_CONSENT=Y
  - NVIDIA_VISIBLE_DEVICES=all
  - NVIDIA_DRIVER_CAPABILITIES=all
  - DISPLAY=${DISPLAY}
  - QT_X11_NO_MITSHM=1
  - ISAACLAB=/workspace/isaaclab
  - HUMANOID_ROOT=/workspace/humanoid
  - TASK_ROOT=/workspace/humanoid/src/simulation/garment_fold_task
  # Map container-written files back to the host user (Isaac must run as root).
  - HOST_UID=${HOST_UID:-1000}
  - HOST_GID=${HOST_GID:-1000}
  - OWNERSHIP_FIX_INTERVAL=${OWNERSHIP_FIX_INTERVAL:-30}

services:
  simulation_isaac_garment:
    build:
      context: ..
      dockerfile: docker/simulation/isaac_lab/isaac_lab_garment.Dockerfile
      args:
        SIMULATION_ISAAC_IMAGE: "${SIMULATION_ISAAC_IMAGE:?}"
        TAG: "${TAG}"
      cache_from:
        - "${SIMULATION_ISAAC_GARMENT_IMAGE:?}:${TAG}"
        - "${SIMULATION_ISAAC_GARMENT_IMAGE:?}:main"
    image: "${SIMULATION_ISAAC_GARMENT_IMAGE:?}:${TAG}"
    privileged: true
    gpus: all
    environment: *simulation_isaac_garment_env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes: *simulation_isaac_garment_volumes
    network_mode: host
    stdin_open: true
    tty: true
    command: sleep infinity
