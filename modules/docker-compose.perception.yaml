services:
  perception:
    build:
      context: ..
      dockerfile: docker/perception/perception.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
      cache_from:
        - "${PERCEPTION_IMAGE:?}:${TAG}"
        - "${PERCEPTION_IMAGE:?}:main"
    image: "${PERCEPTION_IMAGE:?}:${TAG}"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ${MONO_DIR}/src/perception/perception:/root/ament_ws/src/perception
    command: /bin/bash -c "ros2 launch perception perception.launch.py"

  # Real wrist camera -> /wrist_cam/image_rect (src/perception/wrist_camera). Same image as
  # perception, but its own service: host networking so the recorder and teleop containers see
  # the topics, and /dev for the camera. Set WRIST_CAM_DEVICE to the camera's /dev/v4l/by-id path.
  wrist_camera:
    image: "${PERCEPTION_IMAGE:?}:${TAG}"
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
    volumes:
      - /dev:/dev
      - ${MONO_DIR}/src/perception/wrist_camera:/root/ament_ws/src/wrist_camera
      - ${MONO_DIR}/src/perception/camera_calibration:/opt/humanoid_py/camera_calibration
      - ${MONO_DIR}/src/pioneer_humanoid:/opt/humanoid_py/pioneer_humanoid
    command: /bin/bash -c "ros2 launch wrist_camera wrist_camera.launch.py device:=${WRIST_CAM_DEVICE:-/dev/video0}"

  voxel_grid:
    build:
      context: ..
      dockerfile: docker/perception/voxel_grid/voxel_grid.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
      cache_from:
        - "${PERCEPTION_VOXEL_IMAGE:?}:${TAG}"
        - "${PERCEPTION_VOXEL_IMAGE:?}:main"
    image: "${PERCEPTION_VOXEL_IMAGE:?}:${TAG}"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes:
      - ${MONO_DIR}/src/perception/voxel_grid:/root/ament_ws/src/voxel_grid
    command: tail -F anything
