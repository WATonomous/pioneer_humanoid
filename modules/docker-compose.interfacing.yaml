services:
  interfacing:
    build: &interfacing
      context: ..
      dockerfile: docker/interfacing/interfacing.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
      cache_from:
        - "${INTERFACING_IMAGE:?}:${TAG}"
        - "${INTERFACING_IMAGE:?}:main"
    image: "${INTERFACING_IMAGE:?}:${TAG}"
    command: /bin/bash -c "ros2 launch can can.launch.py"
    privileged: true
    network_mode: host # Allow the container to access the host's network interfaces
    cap_add: # Grant the capability to configure network interfaces
      - NET_ADMIN
    environment:
      # Avoid FastDDS SHM isolation between can_node and docker-exec shells
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    volumes:
      - /dev:/dev # Allow access to host devices
      - ${MONO_DIR}/src/interfacing:/root/ament_ws/src/interfacing
      # For calibrate_arm.py --write-mapping
      # (whole dir, not the single file, so the .bak it creates lands on the host)
      - ${MONO_DIR}/src/interfacing/joint_command/config:/calibration
      # Telemetry run folders (gitignored)
      - ${MONO_DIR}/outputs:/outputs
      # Limits, read-only, for telemetry
      - ${MONO_DIR}/src/interfacing/joint_command/config:/opt/joint_command_config:ro
      # Overlay the installed config with the repo copies (per file: the dir also holds the DBC)
      - ${MONO_DIR}/src/interfacing/can/config/mit_profiles.yaml:/opt/watonomous/can/share/can/config/mit_profiles.yaml:ro
      - ${MONO_DIR}/src/interfacing/can/config/params.yaml:/opt/watonomous/can/share/can/config/params.yaml:ro

  joint_command:
    build:
      context: ..
      dockerfile: docker/interfacing/joint_command/joint_command.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
      cache_from:
        - "${INTERFACING_JOINT_COMMAND_IMAGE:?}:${TAG}"
        - "${INTERFACING_JOINT_COMMAND_IMAGE:?}:main"
    image: "${INTERFACING_JOINT_COMMAND_IMAGE:?}:${TAG}"
    network_mode: host
    environment:
      # UDP only: shared-memory discovery fails across users (docker exec)
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    # editable src is bind-mounted; launch it yourself:
    #   watod -t joint_command  ->  ros2 launch joint_command joint_command.launch.py
    command: tail -F anything
    volumes:
      - ${MONO_DIR}/src/interfacing/joint_command:/root/ament_ws/src/joint_command
      # Scripts for telemetry_record.py, outside /root (this container runs as the host user)
      - ${MONO_DIR}/src/interfacing/can/scripts:/opt/humanoid_scripts:ro
      - ${MONO_DIR}/src/interfacing/joint_command/config/arm_calibration.yaml:/calibration/arm_calibration.yaml:ro
      - ${MONO_DIR}/src/interfacing/joint_command/config:/opt/joint_command_config:ro
      # Overlay the installed config so calibration/limit edits apply on node restart
      - ${MONO_DIR}/src/interfacing/joint_command/config:/opt/watonomous/joint_command/share/joint_command/config:ro
      - ${MONO_DIR}/outputs:/outputs
