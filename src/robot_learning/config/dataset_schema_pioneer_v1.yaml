# Pioneer v1 left arm: one data contract for sim (keyboard_teleop) and real (humanoid-record).
robot_id: pioneer_v1_left_arm
repo_id: humanoid/pioneer_v1_left_arm
fps: 25
state_unit: rad  # arm joints; left_gripper is a 0-1 closure fraction

# Real-robot names (joint_command_core.cpp); sim joint in comment.
joint_names:
  - left_shoulder_pitch  # joint1L
  - left_shoulder_roll   # joint2l
  - left_shoulder_yaw    # joint3l
  - left_elbow_pitch     # joint4l
  - left_elbow_roll      # joint5l
  - left_wrist_pitch     # joint6l
  - left_gripper         # joint7l/joint8l: 0 = open, 1 = closed

# All 640x480 (4:3). Sim poses/lenses: pioneer_humanoid/arm_params.py. Real: `topic`.
# `enabled` is the default; override with --cameras.
images:
  ego:
    height: 480
    width: 640
    enabled: true
    topic: null  # no real camera yet
  wrist_left:
    height: 480
    width: 640
    enabled: true
    topic: /camera/color/image_raw
  wrist_right:  # not on the real arm yet
    height: 480
    width: 640
    enabled: false
    topic: null
  top:  # world-mounted overhead camera of the MuJoCo scenes that have one (tidy_table); --cameras top,...
    height: 480
    width: 640
    enabled: false
    topic: null

ros:  # real only
  action_topic: /arm/joint_targets
  state_topic: null  # null: state mirrors action (no motor feedback yet)
  arm_pose_unit: deg

record:
  root: datasets/pioneer_v1_left_arm  # relative to the repo root; sim -> <root>/sim, real -> <root>/real
  use_videos: true
  image_writer_threads: 4
  image_writer_processes: 0
