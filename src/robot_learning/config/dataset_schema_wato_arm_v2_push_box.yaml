# Dataset schema: push-box-into-container, pioneer_bimanual_arm left (L-suffix)
# chain, Quest VR teleop via run_quest_controller_teleop.py.
robot_id: wato_arm_v2_push_box_sim_v1
repo_id: humanoid/wato_arm_v2_push_box
# Sets info.json robot_type explicitly; without it the recorder falls back to
# "so101_follower", which mislabels this arm.
robot_type: wato_arm_v2

# Fallback only -- run_quest_controller_teleop.py overrides with its derived _RECORD_FPS.
fps: 10

# observation.state AND action are joint positions. Column order follows the
# articulation, which matches this list. Gripper: only joint7l is logged --
# joint8l is driven as its synchronized opposite (one GL40 motor, both fingers;
# see armWithStand_v2_cfg.py's GRIPPER_OPEN/CLOSED), not an independent DOF.
joint_names:
  - joint1L
  - joint2l
  - joint3l
  - joint4l
  - joint5l
  - joint6l
  - joint7l

images:
  ego:
    height: 480
    width: 640
    enabled: true
  wrist:
    height: 480
    width: 640
    enabled: true

record:
  root: datasets/record_wato_arm_v2_push_box
  use_videos: true
