[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain_core"
version = "0.0.0"
description = "ROS-free terrain mapping core: preprocessing, elevation, traversability"
requires-python = ">=3.10"
dependencies = [
    # numpy<2: the terrain and perception images pin numpy 1.26.4 for Humble's
    # apt Python stack (cv_bridge needs numpy 1.x)
    "numpy<2",
    "pyyaml",
    # slam_core is not on PyPI: install it from this repo in the same pip command (see README)
    "slam_core",
]

[project.optional-dependencies]
# pillow: only terrain_tools/tum.py (reading TUM PNGs) and its tests use it
dev = ["matplotlib", "scipy", "pytest", "pillow"]

[tool.setuptools.packages.find]
include = ["terrain_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
