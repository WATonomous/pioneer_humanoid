# Handheld UMI gripper rig. Shared defaults; per-unit measurements (calibrate_*.py) go in umi_calibration.json next
# to this file and override the matching keys here (committed, as the leader arm's leader_arm.json: one rig, so
# nobody else has to re-measure it).
#
# Frames
#   world   the headset's WebXR local-floor space (y up, metres). Re-centring moves it, so data is stored relative
#           to each episode's first pose and the world frame never matters.
#   grip    the mounted controller's WebXR gripSpace (what index.html streams).
#   tcp     the tool point, with the ROBOT's tool axes (pioneer_humanoid/arm_8dof_params.py: link7's axes at
#           TCP_LOCAL, between the jaws 25 mm up from the tips): fingers point along -Z, +X toward the palm's top.
#           Keeping the robot's axes is what lets a policy trained here run on the arm through IK unchanged.
#   camera  OpenCV optical frame (+Z out of the lens, +Y down the image).

headset: quest2            # quest2 | quest3: picks the mount below (the controllers differ in shape)
controller: right          # which controller is mounted on the gripper

# Pose of the tcp frame in the grip frame, per headset. rpy_deg (URDF order: Rz Ry Rx) comes from your CAD mount;
# xyz is a CAD placeholder that calibrate_tcp.py measures (pivot calibration) into umi_calibration.json.
mounts:
  quest2:
    grip_to_tcp: {xyz: [0.0, -0.05, -0.18], rpy_deg: [0.0, 0.0, 0.0]}
  quest3:
    grip_to_tcp: {xyz: [0.0, -0.05, -0.18], rpy_deg: [0.0, 0.0, 0.0]}

# Pose of the camera (OpenCV frame) in the tcp frame. Default: the robot's wrist camera (arm_8dof_params _WRIST_POS /
# _WRIST_ROT relative to TCP_LOCAL), which the handheld mount must copy. calibrate_camera.py measures the real one.
tcp_to_camera: {xyz: [0.0184, 0.0, 0.1054], quat_xyzw: [0.707107, -0.707107, 0.0, 0.0]}

# Seconds each stream's host timestamp is LATE relative to the moment it describes (subtracted in post-processing).
# Only differences between them matter; calibrate_camera.py measures camera_s - pose_s.
latency: {pose_s: 0.0, camera_s: 0.0, width_s: 0.0}

camera:
  device: 0                # OpenCV index, or /dev/v4l/by-id/... on Linux (stable across reboots)
  rectify: true            # wrist_cam.rectify(): the 640x480 pinhole the sim wrist cameras render (perception/camera_calibration)
  calib_dir: null          # null: pioneer_humanoid/calib, as the wrist_camera node
  fps: 30
  jpeg_quality: 92

width:
  source: encoder          # encoder (an STS3215 servo used as an encoder, torque off, as the leader arm) | trigger
  servo_id: 1
  baud: 1000000
  usb_serial: null         # calibrate_width.py stores the board's serial; the port is then found on any machine
  port: null               # only without usb_serial
  open_count: null         # raw counts, jaws fully open / closed: calibrate_width.py
  closed_count: null
  rate_hz: 100

server: {host: 127.0.0.1, port: 8444, cert: null, key: null}   # adb reverse tcp:8444 tcp:8444, as the Quest teleop

record:
  raw_root: datasets/umi_raw      # relative to the repo root (git-ignored); one folder per session, one per take

# Post-processing: resampling and the checks a take must pass to enter the dataset.
postprocess:
  fps: 25                         # the repo's dataset rate
  max_tracking_gap_s: 0.1         # longer controller loss inside a take drops it
  max_camera_gap_s: 0.1
  max_speed_m_s: 2.0              # faster TCP motion is a tracking jump, not a hand
  max_angular_speed_rad_s: 15.0
  min_duration_s: 1.0
