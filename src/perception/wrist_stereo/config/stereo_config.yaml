# Wrist Stereo Configuration
# Dynamic baseline stereo using robot kinematics

# Camera topics
left_camera:
  image_topic: /wrist_left/image_raw
  info_topic: /wrist_left/camera_info
  # Calibration file (generated by calibrate_intrinsics)
  intrinsics_file: config/left_intrinsics.yaml
  # Hand-eye calibration (camera pose in wrist frame)
  hand_eye_file: config/left_hand_eye.yaml

right_camera:
  image_topic: /wrist_right/image_raw
  info_topic: /wrist_right/camera_info
  intrinsics_file: config/right_intrinsics.yaml
  hand_eye_file: config/right_hand_eye.yaml

# Robot kinematics
kinematics:
  # URDF path (relative to package share or absolute)
  urdf_file: pioneer_bimanual_arm/urdf/pioneer_bimanual_arm.urdf
  # Links where cameras are mounted
  left_wrist_link: link6l
  right_wrist_link: link6
  # Joint state topic
  joint_state_topic: /interfacing/joint_states
  # Alternative: use ArmPose messages
  use_arm_pose: true
  left_arm_pose_topic: /interfacing/leftArmPose
  right_arm_pose_topic: /interfacing/rightArmPose

# SGBM stereo matcher parameters
sgbm:
  min_disparity: 0
  num_disparities: 128  # Must be divisible by 16
  block_size: 5         # Odd number, typically 3-11
  p1: 100               # Smoothness penalty (8 * channels * blockSize^2)
  p2: 1000              # Larger smoothness penalty
  disp12_max_diff: 1    # Maximum allowed difference in LR consistency check
  pre_filter_cap: 63
  uniqueness_ratio: 10  # Margin in % for best match vs second best
  speckle_window_size: 100
  speckle_range: 32
  mode: sgbm_3way       # sgbm, hh, sgbm_3way, hh4

# Depth output parameters
depth:
  min_range: 0.05       # meters - closer points are clipped
  max_range: 0.5        # meters - further points are clipped (close-range for insertion)
  output_topic: /wrist_stereo/depth
  point_cloud_topic: /wrist_stereo/points
  publish_point_cloud: true
  frame_id: wrist_stereo  # TF frame for the depth output

# Processing
processing:
  rate_hz: 30.0         # Target processing rate
  sync_tolerance: 0.05  # Max time diff between left/right images (seconds)
  downsample: 1         # Downsample factor (1 = full resolution)
