[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain_core"
version = "0.0.0"
description = "ROS-free terrain mapping core: preprocessing, elevation, traversability"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["terrain_core*"]