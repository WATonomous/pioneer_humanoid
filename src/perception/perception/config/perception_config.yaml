# Perception configuration parameters
perception_node:
  ros__parameters:
    # Camera parameters
    camera:
      image_topic: "/camera/image_raw"
      depth_topic: "/camera/depth/image_raw"
      camera_frame: "camera_link"
      
    # Image processing parameters
    image_processing:
      enable_edge_detection: true
      canny_threshold_low: 100
      canny_threshold_high: 200
      
    # Depth processing parameters
    depth_processing:
      max_range: 10.0  # meters
      min_range: 0.1   # meters
      
    # Publishing parameters
    publish_rate: 30.0  # Hz
    
    # Debug parameters
    debug_mode: false
    save_debug_images: false

shuttlecock_detector_node:
  ros__parameters:
    image_topic: "/camera/camera/color/image_raw"
    point_topic: "/perception/shuttlecock/detections_2d"
    visible_topic: "/perception/shuttlecock/detection_visible"
    weights: "/data/weights/yolo26n.pt"   # update to "/data/weights/yolo26n_v2.pt"
    imgsz: 1280
    conf_threshold: 0.60
    class_ids: [0]
    half: true

shuttlecock_localizer_node:
  ros__parameters:
    point_topic: "/perception/shuttlecock/detections_2d"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/aligned_depth_to_color/camera_info"
    output_topic: "/perception/shuttlecock/detections_3d"
    sync_slop: 0.015
    sync_queue_size: 60   # 2 s of depth at 30 Hz

pose_estimation_node:
  ros__parameters:
    image_topic: "/camera/color/image_raw"
    output_topic: "/perception/pose_estimation"
    person_weights: "/data/weights/yolo26n.pt"
    pose_onnx: "/opt/models/rtmpose-s_body7.onnx"
    half: true
    imgsz: 640
    person_conf: 0.50

trajectory_EKF_prediction_node:
  ros__parameters:
    # The localizer reports positions in the camera's optical frame (x right, y down, z forward)
    gravity_frame: "optical"
    camera_pitch_deg: 0.0  # how far the camera looks up from level: set to the camera's real mount angle
