# Single source of truth for the badminton receive env.
# Loaded by aero.py (load_params). Anything the MJCF needs is baked in by
# scripts that read this file; the MJCF never hardcodes a second copy.

shuttle:
  mass: 0.005            # kg (regulation 4.74-5.50 g)
  skirt_diameter: 0.065  # m -> A ~ 3.32e-3 m^2
  radius: 0.033          # m, skirt collision sphere (floor/net contacts)
  cork_radius: 0.0135    # m, cork collision sphere (racket-face + floor
  cork_center_z: 0.0715  # contacts); center placed so the sphere surface
                         # coincides with the mesh cork tip at z = 0.085
  v_t: 6.75              # m/s measured terminal velocity target
  # k = g / v_t^2 is derived at load time; do not add a second copy here.
  orient_tau: 0.05       # s, first-order lag of the cork-first visual alignment

air:
  density: 1.204         # kg/m^3 at 20 C (informational; k is the lumped param)

gravity: 9.81

integrator:
  dt: 0.001              # s, RK4 reference and mujoco timestep
  method: Euler          # semi-implicit Euler + half-step drag hook: stable contacts, parity < 1 cm

court:
  length: 13.4           # m, full court along y; net line at y = 0
  width: 6.1             # m along x

net:
  height_top: 1.55       # m, uniform (ledger: real center sags to 1.524)
  height_bottom: 0.79    # m, bottom of the band
  thickness: 0.02        # m

arm:
  base_y: -2.0           # m, arm base this far behind the net (net at y=0)
  base_x: -0.245         # m, stand shifted so the right arm's swing plane
                         # (laterally offset from the base by the chain's
                         # y-offsets) passes through court center x=0;
                         # = -(link6 y in the base frame at qpos 0), printed
                         # by build_scene.py
  mount_height: 1.1997   # m, base_link origin above floor = stand height, so
                         # the stand foot rests on the floor
  mount_yaw_deg: 90.0    # deg, yaw of the base so the robot's front (+x base,
                         # the ego-camera direction) faces the net (+y world)
  urdf: ../../../assets/pioneer_bimanual_arm/urdf/pioneer_bimanual_arm.urdf  # relative to this package
  # dual-arm model; only the right arm (joint1-6) is actuated. The left arm
  # (joint1L-8l) and both grippers (joint7/8) are frozen at the zero pose.
  joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  # Rest pose the arm returns to after the hit (BadmintonAction overrides
  # the policy target once the face has met the shuttle): hanging straight
  # down with a slight elbow bend so the racket points down-forward and
  # clears the floor (face centre 0.18 m up, FK-checked). Same joint order.
  rest_joint_pos: [0.0, 0.0, 0.0, 0.5, 0.0, 0.0]
  palm_body: link6       # gripper base; the racket welds here
  # ledger: joint damping/armature below are additions for actuation stability,
  # not re-parameterizations of the arm kinematics/inertia. Per joint, scaled
  # to motor size: a uniform 0.1 was the original stability choice, but 0.1 on
  # the tiny GL40 wrist rotor is unphysical drag (2 Nm at swing rates vs its
  # 0.73 Nm peak) — small motors get small damping.
  joint_damping: [0.1, 0.1, 0.1, 0.1, 0.05, 0.02]
  joint_armature: 0.01
  # ledger: ranges are human-like per joint (not +-pi: unconstrained ranges
  # let IK pick contorted behind-the-back branches), then clipped to the
  # URDF <limit> tags, which are the hardware-live limits
  # (src/pioneer_humanoid urdf_joint_limits.py writes them onto the USD).
  # build_scene.py re-applies the clip and prints any joint it narrows, so
  # widening a value here past the URDF has no effect. Efforts come from
  # torque_limits below.
  # Signs from FK probes: j1 - = shoulder forward, j2 - = abduction away
  # from the body (right arm), j4 + = elbow flexes forward.
  # Same joint order as control.kp.
  joint_range:
    - [-2.3, 0.6]    # joint1 shoulder pitch (forward flexion negative); URDF lower -2.304
    - [-1.57, 0.349] # joint2 shoulder roll (abduction negative); URDF [-1.571, 0.349]
    - [-1.39, 1.6]   # joint3 upper-arm rotation; URDF lower -1.396
    - [-0.1, 2.31]   # joint4 elbow (flexes forward only); URDF upper 2.313
    - [-2.0, 1.31]   # joint5 forearm rotation; URDF upper 1.316
    - [-2.0, 2.0]    # joint6 wrist; URDF +-2pi
  # datasheet peak torques (watonomous.github.io/humanoid-docs/mechanical):
  # joints 1-2 AK10-9 (18 Nm rated / 53 peak), joints 3-5 AK80-9 (9 / 22),
  # joint 6 GL40 II KV70 (0.25 / 0.73). Peaks used: a swing is a transient
  # load. The GL40 wrist is the bottleneck: even with wrist-sparing IK
  # weights, per-joint step caps and small wrist damping, swing tracking
  # degrades vs the earlier CubeMars-class guesses (78% -> ~61% contact).
  # Operational envelope (2026-09-10): the AK motors are capped at their
  # RATED (continuous) torque, not the transient peak - the demo policy sat
  # at the peak clamp in ~90% of rallies, which no real drive sustains. The
  # GL40 wrist keeps its peak: its rated 0.25 Nm cannot even hold the racket
  # horizontal (0.09 kg at 0.45 m = 0.4 Nm), the pending hardware decision.
  torque_limits: [18.0, 18.0, 9.0, 9.0, 9.0, 0.73]
  # datasheet rated (continuous) torques, same motor mapping; used by the
  # training feasibility metrics to flag time spent above sustainable load
  torque_rated: [18.0, 18.0, 9.0, 9.0, 9.0, 0.25]

racket:
  face_size: [0.12, 0.15, 0.012]  # m, full extents of the collision box
  total_mass: 0.090               # kg, racket assembly
  head_length: 0.28               # m, real head length used to scale meshes
  face_offset_y: 0.45             # m, grip point to face center along the handle
  # grip point in the link6 (gripper base) frame: centered between the finger
  # pads (joint7 at y=+0.026, joint8 at y=-0.077), mid-finger depth
  grip_pos: [0.0, -0.0255, -0.15]
  handle_mass: 0.030
  face_mass: 0.060

contact:
  # calibrated by scan (gate 2.2) for the CORK sphere contact: apex
  # restitution e = 0.70-0.77 at 3-8 m/s (budget: 12 mm face + 13.5 mm cork)
  face_solref: [0.012, 0.11]
  face_solimp: [0.9, 0.95, 0.01]
  floor_solref: [0.01, 1.0]
  net_solref: [0.01, 1.0]

launcher:
  t_star_range: [0.9, 1.4]       # s, intercept time
  speed_range: [4.0, 8.0]        # m/s, incoming speed at p*
  descent_deg_range: [20.0, 60.0]  # deg below horizontal at p*
  yaw_deg_max: 30.0              # deg, incoming heading from straight -y
  launch_y_range: [3.0, 6.2]     # m, far-court band
  launch_z_range: [1.0, 2.5]     # m
  launch_x_max: 2.5              # m, |x| bound at launch
  max_launch_speed: 30.0         # m/s, reject anti-damped blowups
  net_margin: 0.05               # m, inbound clearance over the net
  sweet_point: [0.0, -1.6, 1.25] # m, central bias target for p*
  sweet_sigma: 0.35              # m, gaussian bias width

workspace:
  n_samples: 250000              # posture predicates reject more, sample more
  face_normal_max_deg: 55.0      # face normal within this of net-facing +y
                                 # (55 so the cloud covers the ~50-deg-up
                                 # pre-hit orientation along u_out)
  margin: 0.10                   # m, conservative box shrink
  kdtree_radius: 0.07            # m, membership radius to nearest cloud point
  min_face_z: 0.3                # m, discard configs with the face underground
  self_collision_depth: 0.005    # m, penetration deeper than this rejects
  # natural-receive posture filter (relative to arm.base_y):
  face_front_margin: 0.10        # m, face at least this far in front of chest
  elbow_back_margin: 0.10        # m, elbow at most this far behind the chest

perception:
  # Simulated vision pipeline for the student policy's trajectory prior: each
  # control tick the true shuttle position is corrupted with sigma_meas noise
  # and fed to an EKF over the drag model; the prior is the EKF state rolled
  # forward. Early in the flight the estimate is poor so the predicted
  # trajectory jumps tick to tick; it converges as measurements accumulate,
  # matching how the real perception model refines its fit. The teacher
  # (privileged) policy gets the same features computed from the true state.
  sigma_meas: 0.03       # m, per-axis position measurement noise
  sigma_p0: 0.05         # m, initial position uncertainty
  sigma_v0: 8.0          # m/s, initial velocity uncertainty (uninformed)
  sigma_acc: 2.0         # m/s^2, process noise (unmodeled aero/spin)
  n_traj: 8              # points in the trajectory-prior observation
  traj_dt: 0.1           # s, spacing of the prior points (0.1 .. 0.8 ahead)
  traj_sub_dt: 0.025     # s, internal RK4 step when rolling the prior out

control:
  hz: 50
  # position-servo PD gains per arm joint, order = arm.joints:
  # joint1 (shoulder pitch), joint2 (shoulder roll), joint3 (shoulder yaw /
  # upper-arm rotation), joint4 (elbow), joint5 (forearm rotation), joint6 (wrist)
  # Realism pass (2026-08-20): the previous kp [600,600,300,300,100,60] /
  # kv [30,30,15,15,5,3] exceeded what the real drives can be commanded to.
  # AK-series MIT protocol ranges are kp 0-500, kd 0-5 (autonomy/interfacing/
  # can/config/mit_profiles.yaml); no gains are configured on hardware yet
  # (behaviour/joint_command/config/arm_actuators.yaml says start kp < 10).
  # kp 60 / kv 3 on the 0.73 Nm GL40 wrist saturated the actuator at any
  # tracking error > 0.7 deg (run-8 eval: 95% of ticks above rated torque),
  # so the wrist gets the "start low" placeholder until the drive is tuned.
  kp: [400.0, 400.0, 300.0, 300.0, 100.0, 8.0]
  kv: [5.0, 5.0, 5.0, 5.0, 2.0, 0.3]
  # Command moderation, mirroring the hardware path
  # (autonomy/behaviour/joint_command: per-tick velocity cap on the target,
  # then low-pass q <- alpha*q_prev + (1-alpha)*q). The MECHANISM is hardware
  # truth: the real arm cannot receive bang-bang position targets. The
  # VALUES: hardware currently runs a bring-up crawl (velocity_max 40 deg/s)
  # that the team intends to raise; no operational value exists in the repo
  # yet, so the sim uses the datasheet rated speeds (the physical ceiling:
  # AK10-9 235 rpm, AK80-9 390 rpm, GL40 430 rpm) and the configured
  # low_pass_alpha 0.85. Copy the team's operational velocity_max here when
  # it is decided; it can only be lower.
  # NOTE the hardware semantics (joint_command_core.cpp armPoseToMotorCmds):
  # the step clamp AND the low-pass are both taken relative to the previous
  # low-passed output, so the arm's steady-state speed is
  #   (1 - low_pass_alpha) * velocity_max = 0.15 * velocity_max,
  # not velocity_max. The sim mirrors that exactly. Hence the old datasheet
  # values (24.6/40.8/45) gave effective caps of 3.7/6.1/6.8 rad/s - the
  # peaks every trained policy sat at - and the hardware's 40 deg/s bring-up
  # value moves the arm at 6 deg/s.
  # Operational value (2026-09-10): raw 20 rad/s = EFFECTIVE 3 rad/s
  # (~170 deg/s, a brisk human arm) on every joint. Raise when the team
  # commissions a higher value - in these same raw units.
  target_velocity_max: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]   # rad/s raw; x0.15 effective
  low_pass_alpha: 0.85
  # weak-wrist planning: IK joint weights (weight w -> joint moves 1/w^2 as
  # readily) push stroke motion onto the 53/22 Nm shoulder/elbow motors;
  # swing waypoint step caps (rad per 20 ms tick) keep planned distal rates
  # near what the GL40 wrist can track
  ik_joint_weights: [1.0, 1.0, 1.0, 1.0, 1.5, 3.0]
  swing_step_cap: [0.55, 0.55, 0.55, 0.55, 0.35, 0.18]
  t_swing: 0.25          # s
  swing_lead: 0.0        # s, planned-crossing lead; the v2 arm with damping
                         # feedforward tracks with ~7 ms residual lag, so none
                         # is needed
  face_speed_range: [3.0, 5.0]   # m/s at contact
  prehit_offset: 0.15    # m, face center behind p* along -u_out (short
                         # enough to stay inside the natural-posture shell)
  landing_target: [0.0, 3.35]    # x, y on far court (mid-court, centered)
  return_net_clearance: 0.5      # m, required clearance for the return shot
