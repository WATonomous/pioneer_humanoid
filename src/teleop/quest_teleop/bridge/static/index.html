<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quest Teleop</title>
  </head>
  <body>
    <h1>Quest Teleop</h1>
    <button id="start">Start</button>
    <pre id="status">Not connected</pre>

    <canvas id="xr-canvas" style="display:none;"></canvas>

    <script>
      const status = document.getElementById("status");

      const JOINTS = [
        "wrist",

        "thumb-metacarpal",
        "thumb-phalanx-proximal",
        "thumb-phalanx-distal",
        "thumb-tip",

        "index-finger-metacarpal",
        "index-finger-phalanx-proximal",
        "index-finger-phalanx-intermediate",
        "index-finger-phalanx-distal",
        "index-finger-tip",

        "middle-finger-metacarpal",
        "middle-finger-phalanx-proximal",
        "middle-finger-phalanx-intermediate",
        "middle-finger-phalanx-distal",
        "middle-finger-tip",

        "ring-finger-metacarpal",
        "ring-finger-phalanx-proximal",
        "ring-finger-phalanx-intermediate",
        "ring-finger-phalanx-distal",
        "ring-finger-tip",

        "pinky-finger-metacarpal",
        "pinky-finger-phalanx-proximal",
        "pinky-finger-phalanx-intermediate",
        "pinky-finger-phalanx-distal",
        "pinky-finger-tip"
      ];

      function emptyPose() {
        return {
          position: { x: 0, y: 0, z: 0 },
          orientation: { x: 0, y: 0, z: 0, w: 1 }
        };
      }

      function poseToJson(pose) {
        if (!pose) return emptyPose();

        const t = pose.transform;

        return {
          position: {
            x: t.position.x,
            y: t.position.y,
            z: t.position.z
          },
          orientation: {
            x: t.orientation.x,
            y: t.orientation.y,
            z: t.orientation.z,
            w: t.orientation.w
          }
        };
      }

      // right_hand_joints layout:
      // 0-2: wrist xyz
      // 3-5: thumb-metacarpal xyz
      // 6-8: thumb-phalanx-proximal xyz
      // ...

      function handJointsToArray(hand, frame, refSpace) {
        const values = [];

        for (const jointName of JOINTS) {
          const jointSpace = hand.get(jointName);
          const jointPose = jointSpace ? frame.getJointPose(jointSpace, refSpace) : null;

          if (jointPose) {
            values.push(
              jointPose.transform.position.x,
              jointPose.transform.position.y,
              jointPose.transform.position.z
            );
          } else {
            values.push(0, 0, 0);
          }
        }

        return values;
      }

      function createShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader));
        }

        return shader;
      }

      function createProgram(gl, vertexSource, fragmentSource) {
        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
        const program = gl.createProgram();

        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }

        return program;
      }

      function createPointRenderer(gl) {
        const program = createProgram(
          gl,
          `
            attribute vec3 aPosition;
            uniform mat4 uProjection;
            uniform mat4 uView;
            uniform float uPointSize;

            void main() {
              gl_Position = uProjection * uView * vec4(aPosition, 1.0);
              gl_PointSize = uPointSize;
            }
          `,
          `
            precision mediump float;
            uniform vec4 uColor;

            void main() {
              vec2 p = gl_PointCoord - vec2(0.5);
              if (length(p) > 0.5) {
                discard;
              }
              gl_FragColor = uColor;
            }
          `
        );

        return {
          program,
          buffer: gl.createBuffer(),
          aPosition: gl.getAttribLocation(program, "aPosition"),
          uProjection: gl.getUniformLocation(program, "uProjection"),
          uView: gl.getUniformLocation(program, "uView"),
          uPointSize: gl.getUniformLocation(program, "uPointSize"),
          uColor: gl.getUniformLocation(program, "uColor")
        };
      }

      // IK-target marker, drawn as a small HUD-locked quad (2 triangles) in the SAME eye-space
      // (no view matrix) as the POV image quad itself -- positioned from a UV the Python backend
      // projects through the REAL eye cameras (see run_quest_bimanual_teleop.py's
      // _project_world_point_to_uv), not the browser's own raw WebXR hand-tracking position.
      // Those are different coordinate spaces: the operator's physical room-scale hand position
      // has no fixed relationship to the robot's (head-locked, fixed) camera view, which is why
      // drawing at the raw hand position put the marker "at my wrist" instead of "in front of me,
      // teleoped by me" per live feedback. Anchoring to the same quad space as the POV image
      // itself guarantees the marker always lands on the pixel it actually projects to, matching
      // the original Isaac Sim USD marker's on-screen behavior.
      // Not gl.POINTS: point-sprite size is subject to ALIASED_POINT_SIZE_RANGE, a hardware/
      // driver cap WebGL only guarantees down to [1,1]; a quad has no such limit. The fragment
      // shader fakes sphere shading (radial falloff + off-center highlight) to read as a small
      // lit ball, matching the retired markers' look (opacity 0.3, left=blue/right=orange).
      function createMarkerQuadRenderer(gl) {
        const program = createProgram(
          gl,
          `
            attribute vec2 aPosition;
            attribute vec2 aUV;
            uniform mat4 uProjection;
            uniform float uQuadZ;
            varying vec2 vUV;

            void main() {
              gl_Position = uProjection * vec4(aPosition, uQuadZ, 1.0);
              vUV = aUV;
            }
          `,
          `
            precision mediump float;
            varying vec2 vUV;
            uniform vec4 uColor;

            void main() {
              float r = length(vUV);
              if (r > 1.0) {
                discard;
              }
              vec2 highlightOffset = vec2(-0.36, 0.36);
              float highlight = smoothstep(0.9, 0.0, length(vUV - highlightOffset));
              vec3 shaded = mix(uColor.rgb * 0.6, uColor.rgb, 1.0 - r) + highlight * 0.35;
              gl_FragColor = vec4(shaded, uColor.a);
            }
          `
        );

        return {
          program,
          posBuffer: gl.createBuffer(),
          uvBuffer: gl.createBuffer(),
          aPosition: gl.getAttribLocation(program, "aPosition"),
          aUV: gl.getAttribLocation(program, "aUV"),
          uProjection: gl.getUniformLocation(program, "uProjection"),
          uQuadZ: gl.getUniformLocation(program, "uQuadZ"),
          uColor: gl.getUniformLocation(program, "uColor")
        };
      }

      // ── HUD layout ──────────────────────────────────────────────────────────────
      // All of these are in the eye-space quad coordinates described on createQuadRenderer
      // (X ~ -1.1..1.1, Y ~ -0.825..0.825 at Z=-1.5, approximating the eye's near-plane
      // frustum extent). Both feeds are 4:3 -- the sim renders 480x360 eye frames and 640x480
      // wrist frames -- so every height is DERIVED from its width. Retune a width and the
      // aspect stays correct; hand-editing both is how a stretched feed gets introduced.
      const HUD_ASPECT = 4 / 3;

      // Main POV. Was the full -1.1..1.1 / -0.825..0.825 quad with the wrist feed floating over
      // it at half opacity; now a stacked layout, POV above and two wrist panels below, so the
      // panels stop covering the operator's view. Top edge is unchanged, so the horizon sits
      // where it always did -- the quad loses height off the BOTTOM only.
      //
      // POV_QUAD_Y1 is the anchor for the WHOLE stack: every other Y below derives from it, so
      // raising or lowering it slides POV and both panels together without changing any size or
      // gap. That is the knob to reach for if the bottom row sits too low in the headset -- the
      // stack now runs to -1.105, past the approximate -0.825 frustum bound (that bound is not a
      // hard clip; the previous single picture-in-picture already reached -0.930).
      // POV_QUAD_* is shared with the marker-overlay UV->quad-space mapping below, so a marker
      // position computed from the backend's projected UV lands on the same pixel of the POV
      // image regardless of how these bounds are tuned. Retuning here needs no marker change.
      const POV_QUAD_Y1 = 0.825;
      const POV_QUAD_X1 = 0.95, POV_QUAD_X0 = -POV_QUAD_X1;
      const POV_QUAD_Y0 = POV_QUAD_Y1 - (POV_QUAD_X1 - POV_QUAD_X0) / HUD_ASPECT;

      // Wrist panels: side by side in the cleared band, left arm left, right arm right, both
      // centred about X=0 so they read as a matched pair under the POV image. Drawn FULLY
      // OPAQUE (WRIST_HUD_OPACITY) -- they no longer overlap the POV quad, so there is nothing
      // to see through them and blending only washed the image out.
      const WRIST_HUD_OPACITY = 1.0;
      const WRIST_HUD_HALF_GAP_X = 0.02;   // half the horizontal gap between the two panels
      const WRIST_HUD_TOP_GAP = 0.025;     // vertical gap below the POV quad's bottom edge
      const WRIST_HUD_W = 0.64;
      const WRIST_HUD_H = WRIST_HUD_W / HUD_ASPECT;
      const WRIST_HUD_Y1 = POV_QUAD_Y0 - WRIST_HUD_TOP_GAP;
      const WRIST_HUD_Y0 = WRIST_HUD_Y1 - WRIST_HUD_H;

      // POV quad: stereo camera feed, drawn HUD-locked (eye-space only, no
      // view matrix) so it's always visible regardless of head orientation.
      // Two textures (left/right eye), each refreshed from its own static
      // file (/pov_left.jpg, /pov_right.jpg) that run_quest_bimanual_teleop.py
      // overwrites ~10x/sec by capturing two fixed, IPD-separated Kit
      // viewports -- real stereo depth, not a flat mono image.
      // webxr_server.py serves both as plain static files, no server changes.
      // x0/y0/x1/y1 are in the same local quad-space as the original hardcoded
      // POV quad (-1.1..1.1 X, -0.825..0.825 Y at Z=-1.5 -- see drawPovQuad),
      // which approximates the eye's near-plane frustum extent. Defaults
      // reproduce the original full-view POV quad; a smaller sub-range
      // (e.g. top-right corner) makes a picture-in-picture HUD overlay.
      function createQuadRenderer(gl, x0 = -1.1, y0 = -0.825, x1 = 1.1, y1 = 0.825) {
        const program = createProgram(
          gl,
          `
            attribute vec2 aPosition;
            attribute vec2 aTexCoord;
            uniform mat4 uProjection;
            uniform float uQuadZ;
            varying vec2 vTexCoord;

            void main() {
              gl_Position = uProjection * vec4(aPosition, uQuadZ, 1.0);
              vTexCoord = aTexCoord;
            }
          `,
          `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform sampler2D uTexture;
            uniform float uOpacity;

            void main() {
              vec4 texel = texture2D(uTexture, vTexCoord);
              gl_FragColor = vec4(texel.rgb, texel.a * uOpacity);
            }
          `
        );

        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([x0, y0, x1, y0, x0, y1, x1, y1]),
          gl.STATIC_DRAW
        );

        const texBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 1, 1, 1, 0, 0, 1, 0]), gl.STATIC_DRAW);

        return {
          program,
          aPosition: gl.getAttribLocation(program, "aPosition"),
          aTexCoord: gl.getAttribLocation(program, "aTexCoord"),
          posBuffer,
          texCoordBuffer: texBuffer,
          uProjection: gl.getUniformLocation(program, "uProjection"),
          uQuadZ: gl.getUniformLocation(program, "uQuadZ"),
          uTexture: gl.getUniformLocation(program, "uTexture"),
          uOpacity: gl.getUniformLocation(program, "uOpacity")
        };
      }

      function createEyeTexture(gl) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        // Placeholder 1x1 opaque-black pixel until the first frame loads, so
        // the quad doesn't sample from an uninitialized texture (undefined
        // behaviour / driver-dependent garbage on some WebGL implementations).
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
        return texture;
      }

      // opacity: 1.0 = fully opaque (the main POV quads); lower values blend the quad over
      // whatever is already drawn behind it, used by the wrist-cam picture-in-picture so it
      // doesn't block the operator's view of the environment.
      function drawPovQuad(gl, renderer, projectionMatrix, texture, quadZ = -1.5, opacity = 1.0) {
        gl.useProgram(renderer.program);

        gl.bindBuffer(gl.ARRAY_BUFFER, renderer.posBuffer);
        gl.enableVertexAttribArray(renderer.aPosition);
        gl.vertexAttribPointer(renderer.aPosition, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, renderer.texCoordBuffer);
        gl.enableVertexAttribArray(renderer.aTexCoord);
        gl.vertexAttribPointer(renderer.aTexCoord, 2, gl.FLOAT, false, 0, 0);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.uniform1i(renderer.uTexture, 0);

        gl.uniformMatrix4fv(renderer.uProjection, false, projectionMatrix);
        gl.uniform1f(renderer.uQuadZ, quadZ);
        gl.uniform1f(renderer.uOpacity, opacity);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        // Translucent quads must not write depth, or they'd occlude the main POV quad behind
        // them and blend against empty background instead of the scene.
        gl.depthMask(opacity >= 1.0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
      }

      function drawHandPoints(gl, renderer, values, projectionMatrix, viewMatrix, color) {
        if (!values || values.length !== 75) return;

        gl.useProgram(renderer.program);
        gl.bindBuffer(gl.ARRAY_BUFFER, renderer.buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(values), gl.DYNAMIC_DRAW);

        gl.enableVertexAttribArray(renderer.aPosition);
        gl.vertexAttribPointer(renderer.aPosition, 3, gl.FLOAT, false, 0, 0);

        gl.uniformMatrix4fv(renderer.uProjection, false, projectionMatrix);
        gl.uniformMatrix4fv(renderer.uView, false, viewMatrix);
        gl.uniform1f(renderer.uPointSize, 14.0);
        gl.uniform4fv(renderer.uColor, color);

        gl.drawArrays(gl.POINTS, 0, 25);
      }

      // IK-target indicator, drawn as a small HUD-locked quad at the backend-projected UV (see
      // createMarkerQuadRenderer above for why: matching the POV image's own screen-space, not
      // the operator's raw WebXR hand position). markerInfo is one {u, v, visible} entry from
      // the polled /marker_uv.json, already selected for the correct eye by the caller.
      function drawMarkerAtUV(gl, renderer, markerInfo, projectionMatrix, color) {
        if (!markerInfo || !markerInfo.visible) return;

        // Map UV (0..1, top-left origin, matching the PNG's own row order) onto the same
        // x0..x1/y0..y1 quad-space the POV image quad itself is drawn in (POV_QUAD_*), so the
        // marker lands on the same on-screen position as the pixel it was projected from.
        const quadCX = POV_QUAD_X0 + markerInfo.u * (POV_QUAD_X1 - POV_QUAD_X0);
        const quadCY = POV_QUAD_Y0 + (1.0 - markerInfo.v) * (POV_QUAD_Y1 - POV_QUAD_Y0);
        // Confirmed working at 0.06; live feedback was it's now blocking the view of the cube --
        // shrunk to 40% of that (~0.024) per live feedback.
        const halfSize = 0.024;

        const corners = new Float32Array([
          quadCX - halfSize, quadCY - halfSize,
          quadCX + halfSize, quadCY - halfSize,
          quadCX - halfSize, quadCY + halfSize,
          quadCX + halfSize, quadCY + halfSize,
        ]);
        const uvs = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);

        gl.useProgram(renderer.program);

        gl.bindBuffer(gl.ARRAY_BUFFER, renderer.posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, corners, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(renderer.aPosition);
        gl.vertexAttribPointer(renderer.aPosition, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, renderer.uvBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(renderer.aUV);
        gl.vertexAttribPointer(renderer.aUV, 2, gl.FLOAT, false, 0, 0);

        gl.uniformMatrix4fv(renderer.uProjection, false, projectionMatrix);
        // Slightly closer than the main POV quad (-1.5) so it reliably draws on top, same
        // reasoning as the wrist_cam HUD quad.
        gl.uniform1f(renderer.uQuadZ, -1.45);
        // Matches the retired Isaac Sim USD markers: same left=blue/right=orange colors, sphere-
        // shaded (see createMarkerQuadRenderer), same 0.3 opacity now that positioning is
        // confirmed working.
        gl.uniform4fv(renderer.uColor, [color[0], color[1], color[2], 0.3]);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.disable(gl.BLEND);
      }

      document.getElementById("start").onclick = async () => {
        const wsUrl = `wss://${window.location.hostname}:9090`;
        const ws = new WebSocket(wsUrl);

        status.textContent = `Connecting to ${wsUrl}`;

        ws.onopen = async () => {
          status.textContent = "WSS connected. Starting WebXR...";

          const useAr = await navigator.xr.isSessionSupported("immersive-ar");
          const sessionMode = useAr ? "immersive-ar" : "immersive-vr";

          // Quest 2 CONTROLLERS, not hand tracking: no required features. Hand tracking was:
          // const session = await navigator.xr.requestSession(sessionMode, {
          //   requiredFeatures: ["hand-tracking"]
          // });
          const session = await navigator.xr.requestSession(sessionMode);

          const canvas = document.getElementById("xr-canvas"); //needed for scene and getting pose data
          const gl = canvas.getContext("webgl", {
            xrCompatible: true,
            alpha: true
          });
          const pointRenderer = createPointRenderer(gl);
          const markerRenderer = createMarkerQuadRenderer(gl);
          const quadRenderer = createQuadRenderer(gl, POV_QUAD_X0, POV_QUAD_Y0, POV_QUAD_X1, POV_QUAD_Y1);
          // Two wrist panels in the band below the POV quad (see the HUD layout block above).
          // Superseded a single half-transparent picture-in-picture that floated over the
          // bottom-right of the POV image; that one showed only the link6l wrist, so the other
          // gripper was never visible. Geometry is baked into each renderer's vertex buffer at
          // creation, hence two renderers rather than one drawn twice.
          const wristHudRendererLeft = createQuadRenderer(
            gl, -(WRIST_HUD_HALF_GAP_X + WRIST_HUD_W), WRIST_HUD_Y0, -WRIST_HUD_HALF_GAP_X, WRIST_HUD_Y1);
          const wristHudRendererRight = createQuadRenderer(
            gl, WRIST_HUD_HALF_GAP_X, WRIST_HUD_Y0, WRIST_HUD_HALF_GAP_X + WRIST_HUD_W, WRIST_HUD_Y1);
          const leftEyeTexture = createEyeTexture(gl);
          const rightEyeTexture = createEyeTexture(gl);
          const wristCamTextureLeft = createEyeTexture(gl);
          const wristCamTextureRight = createEyeTexture(gl);

          // Periodically fetch both eyes' latest POV frames and stash them;
          // the actual gl.texImage2D upload happens once in onFrame (not
          // here) since WebGL calls must happen on the frame that has the XR
          // context bound -- this loop just keeps decoded ImageBitmaps ready.
          let pendingLeftBitmap = null;
          let pendingRightBitmap = null;
          let pendingWristLeftBitmap = null;
          let pendingWristRightBitmap = null;
          async function refreshPovTexture(path, setPending) {
            try {
              const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" });
              if (!res.ok) return;
              const blob = await res.blob();
              setPending(await createImageBitmap(blob));
            } catch (e) {
              // Transient fetch/decode failure (frame not written yet, network
              // hiccup) -- next interval tick retries, nothing to do here.
            }
          }
          // Polled the same way and cadence as the POV images -- written atomically (temp file +
          // rename) by run_quest_bimanual_teleop.py, so this should never observe a torn/partial
          // JSON, but a stale/absent value here just means the marker skips a draw this frame.
          let markerUV = null;
          async function refreshMarkerUV() {
            try {
              const res = await fetch(`/marker_uv.json?t=${Date.now()}`, { cache: "no-store" });
              if (!res.ok) return;
              markerUV = await res.json();
            } catch (e) {
              // Same as refreshPovTexture -- transient failure, next tick retries.
            }
          }
          // Re-fetch as soon as the previous round-trip finishes, plus a small floor delay.
          // An earlier version had a hard setInterval(..., 200) that capped the headset at 5fps
          // regardless of how fast the backend produced frames; that cap was rightly removed.
          // But a completely unpaced loop spins as fast as the link allows and mostly
          // re-downloads a frame the sim hasn't regenerated yet (the backend writes new POV
          // frames at only ~5-6fps -- see the [Quest][fps] print), so those redundant fetches
          // just occupy the tunnel and delay the next genuinely-new frame. POV_POLL_FLOOR_MS
          // sits well above the backend's real rate, so it never becomes the bottleneck.
          const POV_POLL_FLOOR_MS = 25;
          let povPollActive = true;
          async function povPollLoop() {
            while (povPollActive) {
              const cycleStart = performance.now();
              await Promise.all([
                refreshPovTexture("/pov_left.jpg", (bmp) => { pendingLeftBitmap = bmp; }),
                refreshPovTexture("/pov_right.jpg", (bmp) => { pendingRightBitmap = bmp; }),
                refreshPovTexture("/wrist_cam_left.jpg", (bmp) => { pendingWristLeftBitmap = bmp; }),
                refreshPovTexture("/wrist_cam_right.jpg", (bmp) => { pendingWristRightBitmap = bmp; }),
                refreshMarkerUV(),
              ]);
              const remaining = POV_POLL_FLOOR_MS - (performance.now() - cycleStart);
              if (remaining > 0) {
                await new Promise((resolve) => setTimeout(resolve, remaining));
              }
            }
          }
          povPollLoop();
          session.addEventListener("end", () => { povPollActive = false; });

          session.updateRenderState({
            baseLayer: new XRWebGLLayer(session, gl, {
              alpha: true
            })
          });

          const refSpace = await session.requestReferenceSpace("local");

          function onFrame(time, frame) {
            session.requestAnimationFrame(onFrame);

            const payload = {
              left_wrist: emptyPose(),
              right_wrist: emptyPose(),
              left_hand_joints: Array(75).fill(0),
              right_hand_joints: Array(75).fill(0),
              head_pose: emptyPose(),
              left_trigger: 0,
              right_trigger: 0,
              reset_button: false,
              save_button: false
            };

            // Hand tracking (wrist joint pose + 25 hand joints for pinch), disabled for controllers:
            // for (const inputSource of session.inputSources) {
            //   if (!inputSource.hand) continue;
            //
            //   const wristSpace = inputSource.hand.get("wrist");
            //   const wristPose = wristSpace ? frame.getJointPose(wristSpace, refSpace) : null;
            //
            //   if (inputSource.handedness === "left") {
            //     payload.left_wrist = poseToJson(wristPose);
            //     payload.left_hand_joints = handJointsToArray(inputSource.hand, frame, refSpace);
            //   }
            //
            //   if (inputSource.handedness === "right") {
            //     payload.right_wrist = poseToJson(wristPose);
            //     payload.right_hand_joints = handJointsToArray(inputSource.hand, frame, refSpace);
            //   }
            // }

            // Quest 2 controllers: the grip space (where the controller is held) stands in for the
            // wrist pose, and the trigger (gamepad button 0, 0..1) drives the gripper. Inputs with
            // a .hand are skipped, so putting the controllers down sends nothing rather than
            // switching to hand poses mid-session.
            for (const inputSource of session.inputSources) {
              if (inputSource.hand || !inputSource.gripSpace) continue;

              const gripPose = frame.getPose(inputSource.gripSpace, refSpace);
              const trigger = inputSource.gamepad && inputSource.gamepad.buttons.length > 0
                ? inputSource.gamepad.buttons[0].value
                : 0;

              if (inputSource.handedness === "left") {
                payload.left_wrist = poseToJson(gripPose);
                payload.left_trigger = trigger;
                // Y button (xr-standard index 5 on the left controller): resets the sim scene.
                const buttons = inputSource.gamepad ? inputSource.gamepad.buttons : [];
                payload.reset_button = buttons.length > 5 && buttons[5].pressed;
              }

              if (inputSource.handedness === "right") {
                payload.right_wrist = poseToJson(gripPose);
                payload.right_trigger = trigger;
                // B button (xr-standard index 5 on the right controller): save demo + reset.
                const buttons = inputSource.gamepad ? inputSource.gamepad.buttons : [];
                payload.save_button = buttons.length > 5 && buttons[5].pressed;
              }
            }

            if (pendingLeftBitmap) {
              gl.bindTexture(gl.TEXTURE_2D, leftEyeTexture);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pendingLeftBitmap);
              pendingLeftBitmap = null;
            }
            if (pendingRightBitmap) {
              gl.bindTexture(gl.TEXTURE_2D, rightEyeTexture);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pendingRightBitmap);
              pendingRightBitmap = null;
            }
            if (pendingWristLeftBitmap) {
              gl.bindTexture(gl.TEXTURE_2D, wristCamTextureLeft);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pendingWristLeftBitmap);
              pendingWristLeftBitmap = null;
            }
            if (pendingWristRightBitmap) {
              gl.bindTexture(gl.TEXTURE_2D, wristCamTextureRight);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pendingWristRightBitmap);
              pendingWristRightBitmap = null;
            }

            const pose = frame.getViewerPose(refSpace);
            if (pose) {
              payload.head_pose = poseToJson(pose);

              gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
              gl.enable(gl.DEPTH_TEST);
              gl.clearColor(0.0, 0.0, 0.0, useAr ? 0.0 : 1.0);
              gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

              for (const view of pose.views) {
                const viewport = session.renderState.baseLayer.getViewport(view);
                gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

                // view.eye is "left"/"right"/"none" per the WebXR spec -- fall
                // back to the left texture for "none" (mono/AR passthrough
                // frames with a single combined view, no eye separation).
                const eyeTexture = view.eye === "right" ? rightEyeTexture : leftEyeTexture;
                drawPovQuad(gl, quadRenderer, view.projectionMatrix, eyeTexture);
                // Wrist panels, drawn slightly closer than the main POV quad (-1.45 vs -1.5).
                // They no longer overlap it, so this is belt-and-braces against z-fighting
                // rather than a requirement. Opaque, so drawPovQuad re-enables depth writes.
                drawPovQuad(gl, wristHudRendererLeft, view.projectionMatrix,
                            wristCamTextureLeft, -1.45, WRIST_HUD_OPACITY);
                drawPovQuad(gl, wristHudRendererRight, view.projectionMatrix,
                            wristCamTextureRight, -1.45, WRIST_HUD_OPACITY);

                // Hand-joint point overlay, disabled with hand tracking (no joints from controllers):
                // drawHandPoints(
                //   gl,
                //   pointRenderer,
                //   payload.left_hand_joints,
                //   view.projectionMatrix,
                //   view.transform.inverse.matrix,
                //   [0.1, 1.0, 0.25, 1.0]
                // );
                //
                // drawHandPoints(
                //   gl,
                //   pointRenderer,
                //   payload.right_hand_joints,
                //   view.projectionMatrix,
                //   view.transform.inverse.matrix,
                //   [0.0, 0.75, 1.0, 1.0]
                // );

                // IK-target indicators (blue=left, red=right, matching the retired Isaac Sim USD
                // markers' colors) -- drawn at the backend-projected UV for THIS eye (view.eye),
                // i.e. the actual pixel the target occupies in the POV image, not the operator's
                // raw wrist-tracking position (see drawMarkerAtUV/createMarkerQuadRenderer above).
                const _markerEye = view.eye === "right" ? markerUV && markerUV.right_eye : markerUV && markerUV.left_eye;
                drawMarkerAtUV(
                  gl, markerRenderer, _markerEye && _markerEye.left_arm,
                  view.projectionMatrix, [0.2, 0.5, 1.0, 0.8]
                );
                drawMarkerAtUV(
                  gl, markerRenderer, _markerEye && _markerEye.right_arm,
                  view.projectionMatrix, [1.0, 0.3, 0.1, 0.8]
                );
              }
            }

            if (ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify(payload));
            }

            status.textContent = `Streaming controller data (${sessionMode})`;
          }

          session.requestAnimationFrame(onFrame);
        };

        ws.onerror = () => {
          status.textContent = "WebSocket error";
        };

        ws.onclose = () => {
          status.textContent = "WebSocket closed";
        };
      };
    </script>
  </body>
</html>
