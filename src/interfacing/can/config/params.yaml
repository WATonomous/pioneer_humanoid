# Parameters for the CAN node
can_node:
  ros__parameters:
    # CAN Interface Configuration
    can_interface: "can0"              # CAN interface name (can0, can1, etc.)
    device_path: "/dev/canable"        # Serial device path for SLCAN
    bustype: "slcan"                   # Bus type to create a CAN interface: "socketcan" or "slcan"
    bitrate: 1000000                   # CAN bitrate in bps (125000, 250000, 500000, 1000000)
    
    # Communication Settings
    receive_poll_interval_ms: 10           # Interval for polling CAN messages in milliseconds

    # MIT: CAN id the GL II drives reply on ("master id", default 0x000).
    mit_master_id: 0
