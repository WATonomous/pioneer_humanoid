# Per-motor MIT (Force Control) protocol scaling constants, from the CubeMars AK-series
# manual (V3.2.0, section 4.2 "Parameter Ranges"). These are the physical MIN/MAX each
# motor model uses to pack floats into the MIT CAN frame's raw fixed-point fields -- they
# are NOT the same as arm_calibration.yaml's calibration (zero_offset/direction/limits),
# which only applies to POSITION_LOOP. Wrong values here would pack an incorrect raw code
# and command an unintended stiffness/torque/position via MIT_CONTROL.
# GL40 ranges are the GL II manual V1.0 section 5 defaults. Ranges are per-drive settings
# (CubeMars upper computer): fix them here if a drive was reconfigured.
#
# family: ak  -- AK V3.0: extended frame, KP-first payload, no ENTER/EXIT. Feedback is the servo
#                frame; torque = current * kt (manual table). The manual's CAN examples decode
#                with p +-12.5 / v +-50, not the table values below -- verify on the bench.
#         gl2 -- GL II: standard frame, feedback on mit_master_id, needs MIT_ENTER first.
#
# position (rad), velocity (rad/s), torque (N.m); kp/kd ranges are shared across AK models.
# gl2 velocity is in the drive's "r/s".
# Keyed by motor CAN id (decimal), matching arm_calibration.yaml's left-arm can_id values.

motors:
  # AK10-9 -- shoulder_pitch (0x0E), shoulder_roll (0x0D)
  "14": {model: AK10-9, family: ak, p_min: -12.56, p_max: 12.56, v_min: -28.0, v_max: 28.0, t_min: -54.0, t_max: 54.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, kt: 1.3137}
  "13": {model: AK10-9, family: ak, p_min: -12.56, p_max: 12.56, v_min: -28.0, v_max: 28.0, t_min: -54.0, t_max: 54.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, kt: 1.3137}
  # AK80-9 -- shoulder_yaw (0x0C), elbow_pitch (0x0B), elbow_roll (0x68)
  "12": {model: AK80-9, family: ak, p_min: -12.56, p_max: 12.56, v_min: -65.0, v_max: 65.0, t_min: -18.0, t_max: 18.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, kt: 0.5701}
  "11": {model: AK80-9, family: ak, p_min: -12.56, p_max: 12.56, v_min: -65.0, v_max: 65.0, t_min: -18.0, t_max: 18.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, kt: 0.5701}
  "104": {model: AK80-9, family: ak, p_min: -12.56, p_max: 12.56, v_min: -65.0, v_max: 65.0, t_min: -18.0, t_max: 18.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, kt: 0.5701}
  # GL40 KV70 (GL II) -- wrist_pitch (0x16), gripper open_close (0x15). Verify p_max: with the
  # drive limp, a quarter turn by hand must move MotorFeedback.position by ~90 deg.
  "22": {model: GL40-KV70, family: gl2, p_min: -12.5, p_max: 12.5, v_min: -200.0, v_max: 200.0, t_min: -10.0, t_max: 10.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0}
  "21": {model: GL40-KV70, family: gl2, p_min: -12.5, p_max: 12.5, v_min: -200.0, v_max: 200.0, t_min: -10.0, t_max: 10.0, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0}
