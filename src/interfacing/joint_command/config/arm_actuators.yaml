safety:
  units:
    angle: "deg"
    velocity: "deg_s"
    # mit_kp/mit_kd: only used on joints whose control_type is MIT_CONTROL (0).
    # Per-motor units (kp in [0,500], kd in [0,5] for AK-series -- see
    # can/config/mit_profiles.yaml). Unset/0 (the default below) is a deliberate safe no-op:
    # zero stiffness/damping means the joint stays free even under MIT_CONTROL. Set explicitly
    # per joint to enable compliant holding; start LOW (e.g. kp<10) and increase gradually.

  # Position clamp is ENABLED: calibrate_arm.py's software zero-mode has been run for real,
  # producing real per-joint limits (see arm_calibration.yaml). Re-verify each joint's limits
  # are current (re-run calibration after any power cycle first -- see arm_calibration.yaml's
  # header note on encoder drift).
  # velocity_max is still a deliberate slow crawl for testing; raise once trusted.
  #
  # Per control tick: position clamp -> low-pass -> velocity limit -> delta limit -> position
  # clamp -> calibration. velocity_max is a true deg/s bound, however fast ArmPose arrives.
  global:
    enable_position_clamp: true
    enable_velocity_limit: true
    enable_delta_limit: true
    enable_low_pass: true
    velocity_max: 10.0
    delta_max: 2.4
    low_pass_alpha: 0.85
    control_type: -1   # -1 = joint_command.yaml's control_type; set per joint below
    mit_kp: 0.0   # 0 = MIT_CONTROL is a safe no-op until set per-joint below
    mit_kd: 0.0
    mit_max_torque: 0.3        # N.m, fault above
    mit_max_track_err: 60.0    # deg, fault above
    mit_feedback_timeout: 0.2  # s without feedback -> fault
    # gl2 (GL40) or ak (AK10-9 / AK80-9): they disagree on the status byte.
    mit_family: gl2
    # Fault action follows mit_family: gl2 -> limp (kp = kd = 0); ak -> damp (kp = 0,
    # kd = mit_fault_kd, 0 < kd <= 5) so a loaded shoulder sinks instead of dropping.
    mit_fault_kd: 0.0
    # Gravity feed-forward (MIT joints only), sent as MotorCmd.torque:
    #   ff = clamp(gravity_ff_scale * ramp * tau_model, +-gravity_ff_max_torque)
    # Startup rule: quantised mit_kp * mit_max_track_err + gravity_ff_max_torque <= mit_max_torque.
    # The model reads command-frame angles as URDF angles: arm_calibration.yaml's zero is the
    # URDF zero (hanging) and each direction matches the URDF's positive direction. Check the
    # node's "Gravity model ... pred / meas" log with scale 0 before raising gravity_ff_scale.
    # gravity_assume_deg: angle used for an unpowered joint -- only valid while strapped there.
    gravity_ff_scale: 0.0
    gravity_ff_max_torque: 0.0

  # active: false leaves that motor alone for the run (no command, no MIT enter, no watchdog);
  # to the gravity model its angle is then unknown, as if unpowered. Applies on node restart.
  joints:
    # --- AK10-9 / AK80-9, MIT --------------------------------------------------
    # Limits come from calibrate_arm.py's software zero-mode (see arm_calibration.yaml).
    # Re-run calibration after any power cycle: AK80-9 joints lose their zero (src/interfacing/README.md).
    # Interim gains (#327), not yet bench-checked: mit_max_torque at the testing ceilings
    # (real-hardware-safety skill; the node refuses more): AK10-9 10 N.m, AK80-9 5 N.m. Stall
    # torque = quantised kp * mit_max_track_err 15 deg (0.2618 rad): AK10-9 kp 30 -> 7.86 N.m,
    # AK80-9 kp 19 -> 4.99 N.m (kp 20 would be 5.24, over its ceiling). Gravity feed-forward off
    # until its sign is checked (#325).
    shoulder:
      pitch:   # AK10-9, id 14
        active: true
        velocity_max: 30.0
        delta_max: 2.0
        control_type: 0
        mit_family: ak
        motor: AK10-9
        mit_kp: 30.0
        mit_kd: 0.8
        mit_max_torque: 10.0
        mit_max_track_err: 15.0
        mit_fault_kd: 1.0
        gravity_ff_max_torque: 10.5   # model max 4.7 N.m
        gravity_assume_deg: 0.0
      roll:    # AK10-9, id 13
        active: true
        velocity_max: 30.0
        delta_max: 2.0
        control_type: 0
        mit_family: ak
        motor: AK10-9
        mit_kp: 30.0
        mit_kd: 0.8
        mit_max_torque: 10.0
        mit_max_track_err: 15.0
        mit_fault_kd: 1.0
        gravity_ff_max_torque: 5.5    # model max 4.7 N.m
        gravity_assume_deg: 0.0
      yaw:     # AK80-9, id 12
        active: true
        velocity_max: 60.0
        delta_max: 2.0
        control_type: 0
        mit_family: ak
        motor: AK80-9
        mit_kp: 19.0
        mit_kd: 0.4
        mit_max_torque: 5.0
        mit_max_track_err: 15.0
        mit_fault_kd: 0.5
        gravity_ff_max_torque: 5.5    # model max 1.2 N.m
        gravity_assume_deg: 0.0
    elbow:
      pitch:   # AK80-9, id 11
        active: true
        velocity_max: 30.0
        delta_max: 1.6
        control_type: 0
        mit_family: ak
        motor: AK80-9
        mit_kp: 19.0
        mit_kd: 0.4
        mit_max_torque: 5.0
        mit_max_track_err: 15.0
        mit_fault_kd: 0.5
        gravity_ff_scale: 0.0
        gravity_ff_max_torque: 3.59
        gravity_assume_deg: 0.0
      roll:    # AK80-9, id 104
        active: true
        velocity_max: 30.0
        delta_max: 1.6
        control_type: 0
        mit_family: ak
        motor: AK80-9
        mit_kp: 19.0
        mit_kd: 0.4
        mit_max_torque: 5.0
        mit_max_track_err: 15.0
        mit_fault_kd: 0.5
        gravity_ff_max_torque: 3.3    # model max 0.18 N.m
        gravity_assume_deg: 0.0

    # --- GL40 KV70 on a GL II drive, MIT ---------------------------------------
    # PD drive with NO internal limit checking: mit_max_* below are the only protection.
    # Gains: bench session 2026-09-19 on motor 22. kp quantises to 500/4096 per count, so
    # 1.22 -> raw 10 -> 1.2207 applied. kd must be > 0 (GL II manual: kd = 0 oscillates).
    # Stall: 1.2207 * 0.2094 rad = 0.256 N.m <= 0.3 N.m testing ceiling. Expect a few degrees
    # of sag; gravity feed-forward barely helps (0.044 N.m headroom at these gains).
    wrist:
      pitch:   # GL40, id 22
        active: true
        velocity_max: 30.0
        delta_max: 2.4
        control_type: 0        # MIT_CONTROL
        mit_family: gl2        # fault action defaults to limp: unloaded, safe to free
        motor: GL40
        mit_kp: 1.22           # N.m/rad  -> raw 10 -> 1.2207 applied
        mit_kd: 0.0098         # N.m.s/rad -> raw 8 -> 0.00977 applied
        mit_max_torque: 0.3    # N.m, fault above
        mit_max_track_err: 12.0  # deg, fault above
        mit_feedback_timeout: 0.2  # s without feedback -> fault
        gravity_assume_deg: 0.0

    # Gripper: ArmPose.gripper_position 0 (open, calibrated zero) .. 1 (closed, upper_limit).
    # mit_max_track_err >= full travel (enforced), so a grasp never faults and the squeeze is
    # kp * travel = 0.1221 * 1.833 rad = 0.224 N.m <= 0.25. Gains not yet bench-checked.
    gripper:
      open_close:   # GL40, id 21
        active: true
        velocity_max: 60.0
        delta_max: 2.4
        control_type: 0        # MIT_CONTROL
        mit_family: gl2        # fault action limp
        motor: GL40
        mit_kp: 0.1221         # N.m/rad -> raw 1, the softest nonzero stiffness
        mit_kd: 0.0098         # N.m.s/rad -> raw 8, as the wrist
        mit_max_torque: 0.25   # N.m: grip ceiling, under the GL40's 0.3 testing ceiling
        mit_max_track_err: 105.0  # deg, >= full travel (upper_limit - lower_limit)
        mit_feedback_timeout: 0.2
