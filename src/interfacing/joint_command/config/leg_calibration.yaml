# Leg joints, laid out like arm_calibration.yaml (#477). NOT CALIBRATED: nothing here has been
# checked on the legs.
#   can_id:   PLANNED, not yet set on the drives (#478). Update this file if the drives differ.
#   direction, zero_offset: null ON PURPOSE. A made-up value would load and drive the joint the
#     wrong way or from the wrong zero. No code reads this file yet: the arm loader fails on a
#     null, and the leg loader must do the same (add a test). Set direction by hand to match the
#     URDF; the calibration script writes zero_offset and limits.
#   lower_limit, upper_limit: degrees, the URDF range (assets/pioneer_leg_only_humanoid), until
#     calibration replaces them with the measured range.
left:
  hip:
    pitch:  # AKH70-48, URDF Hip_F_L
      can_id: 40
      lower_limit: -20.0
      upper_limit: 90.0
      direction: null
      zero_offset: null
      limit_range: true
    roll:  # AK80-64, URDF Hip_A_L
      can_id: 41
      lower_limit: -10.0
      upper_limit: 60.0
      direction: null
      zero_offset: null
      limit_range: true
    yaw:  # AK60-39, URDF Hip_R_L
      can_id: 42
      lower_limit: -30.0
      upper_limit: 90.0
      direction: null
      zero_offset: null
      limit_range: true
  knee:
    pitch:  # AKH70-48, URDF Knee_L
      can_id: 43
      lower_limit: -140.0
      upper_limit: 0.0
      direction: null
      zero_offset: null
      limit_range: true
  ankle:
