name: Terrain Core Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: terrain_core pytest
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install terrain_core and slam_core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "src/terrain_mapping/terrain_core[dev]" -e src/perception/slam/slam_core

      - name: Run tests
        working-directory: src/terrain_mapping/terrain_core
        run: python -m pytest -v
