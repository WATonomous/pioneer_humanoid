name: Terrain Core Tests

on:
  pull_request:
    branches:
      - main                     
    paths:                       
      - "src/perception/terrain/**"
      - ".github/workflows/terrain_core_tests.yml"

jobs:
  test:                          
    name: terrain_core pytest   
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install terrain_core
        run: python -m pip install -e "src/perception/terrain/terrain_core[dev]"

      - name: Run tests
        run: python -m pytest src/perception/terrain/terrain_core -v